<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" role="img" aria-label="PlanSight AI">
  <title>PlanSight AI</title>
  <!-- Mark: bar to pupil -->
  <g>
    <rect x="0" y="22" width="36" height="14" rx="3" fill="#22D3EE"/>
    <rect x="40" y="22" width="24" height="14" rx="3" fill="#22D3EE" fill-opacity="0.55"/>
    <circle cx="80" cy="29" r="10" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
    <circle cx="80" cy="29" r="3.5" fill="#22D3EE"/>
  </g>
  <!-- Wordmark: Plan (muted) Sight (accent) -->
  <text x="104" y="38" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.4" fill="#64748B">Plan<tspan fill="#0891B2">Sight</tspan></text>
  <!-- AI suffix -->
  <text x="104" y="56" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#94A3B8">AI</text>
</svg>
